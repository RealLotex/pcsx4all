name: RS-97 renderer regression tests

on:
  push:
    branches: [master, rs97-render-optimizations]
  pull_request:
    branches: [master, experiment-potato-textures]

permissions:
  contents: read

jobs:
  host-renderer-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Compare packed pixels and opaque tile writes
        run: |
          g++ -std=c++11 -O2 -Wall -Wextra -Werror tests/test_rs97_render.cpp -o /tmp/test_rs97_render
          /tmp/test_rs97_render
      - name: Exercise actual production framebuffer helpers (C++03)
        run: |
          g++ -std=c++03 -O2 -Wall -Wextra -Werror tests/test_rs97_hotpaths.cpp -o /tmp/test_rs97_hotpaths
          /tmp/test_rs97_hotpaths
      - name: Verify production GPU Unai 4bpp sprite fast path (C++03)
        run: |
          g++ -std=c++03 -O2 -Wall -Wextra -Werror tests/test_rs97_sprite4bpp.cpp -o /tmp/test_rs97_sprite4bpp
          /tmp/test_rs97_sprite4bpp
      - name: Check memory safety with ASan/UBSan
        run: |
          clang++ -std=c++11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_rs97_render.cpp -o /tmp/test_rs97_render_san
          /tmp/test_rs97_render_san
          clang++ -std=c++03 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_rs97_hotpaths.cpp -o /tmp/test_rs97_hotpaths_san
          /tmp/test_rs97_hotpaths_san
          clang++ -std=c++03 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_rs97_sprite4bpp.cpp -o /tmp/test_rs97_sprite4bpp_san
          /tmp/test_rs97_sprite4bpp_san

# This checks host-side pixel equivalence and memory bounds only.
# It does not compile RetroFW firmware/OPK or test RS-97 hardware.
